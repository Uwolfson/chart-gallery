<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>transitionGraph — test</title>
<script src="../dist/echarts.min.js"></script>
<link rel="stylesheet" href="../lib/charts.css">
<link rel="stylesheet" href="../lib/parts/transition-graph.css">
<style>body { margin: 0; padding: 16px; background: var(--ck-bg); color: var(--ck-text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; } .wrap { max-width: 1100px; margin: 0 auto; } h2 { margin: 0 0 8px; } .fn { font-family: ui-monospace, Consolas, monospace; color: var(--ck-accent); font-size: .9rem; }</style>
</head><body><div class="wrap">
<h2>Transition graph</h2><div class="fn">ChartKit.transitionGraph(el, opts)</div>
<div class="ck-chips" id="ctl">
  <button type="button" class="ck-chip ck-chip--on" data-k="matrixMode" data-v="links">all sessions</button><button type="button" class="ck-chip" data-k="matrixMode" data-v="links2">sessions with a booking</button><button type="button" class="ck-chip" data-k="matrixMode" data-v="diff">difference, pp</button>
  <button type="button" class="ck-chip" data-k="minShare" data-v="10">edges from 10%</button><button type="button" class="ck-chip ck-chip--on" data-k="minShare" data-v="15">from 15%</button><button type="button" class="ck-chip" data-k="minShare" data-v="25">from 25%</button>
</div>
<div class="chart" id="c-transition-graph" style="height:560px"></div>
<script src="../lib/charts.js"></script>
<script src="../lib/parts/transition-graph.js"></script>
<script src="../examples/demo-data.js"></script>
<script src="../examples/parts/transition-graph.js"></script>
<script>
  window.TG = ChartKit.transitionGraph('c-transition-graph', DEMO.transitionGraph());
  document.querySelectorAll('#ctl .ck-chip').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k, v = k === 'minShare' ? +b.dataset.v : b.dataset.v;
    document.querySelectorAll('#ctl .ck-chip[data-k="' + k + '"]').forEach(x => x.classList.toggle('ck-chip--on', x === b));
    TG.redraw({ [k]: v });
  }));
</script>
</div></body></html>
